[project]
name = "80085-worker"
version = "0.1.0"
description = "80085 execution worker"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "80085-common",
    "80085-domain",
    "80085-execution",
    "80085-observability",
]

[project.scripts]
"80085-worker" = "boobs_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boobs_worker"]
