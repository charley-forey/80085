[project]
name = "80085-mcp"
version = "0.1.0"
description = "80085 MCP server"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[project.scripts]
"80085-mcp" = "boobs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boobs_mcp"]
