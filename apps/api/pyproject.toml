[project]
name = "80085-api"
version = "0.1.0"
description = "80085 HTTP API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aioboto3>=13.2",
    "80085-common",
    "80085-domain",
    "80085-schemas",
    "80085-security",
    "80085-retrieval",
    "80085-reputation",
    "80085-verification",
    "80085-observability",
]

# The API's maintenance jobs, run by a Railway cron service from this same
# image with a different start command. Decision 54 explains why they are not
# their own workspace member.
[project.scripts]
"80085-scheduler" = "boobs_api.scheduler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boobs_api"]
