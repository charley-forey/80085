[project]
name = "80085-retrieval"
version = "0.1.0"
description = "intent normalization, hybrid retrieval, ranking"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "80085-domain",
    "80085-observability",
    "80085-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boobs_retrieval"]
