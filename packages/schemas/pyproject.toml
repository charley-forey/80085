[project]
name = "80085-schemas"
version = "0.1.0"
description = "pydantic API models and SQLAlchemy tables"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "pgvector>=0.3.6",
    "80085-domain",
    "80085-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boobs_schemas"]
