[project]
name = "80085-execution"
version = "0.1.0"
description = "ExecutionRuntime protocol and Docker OCI sandbox"
requires-python = ">=3.12"
dependencies = [
    "80085-domain",
    "80085-common",
    "e2b>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boobs_execution"]
