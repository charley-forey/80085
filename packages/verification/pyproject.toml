[project]
name = "80085-verification"
version = "0.1.0"
description = "Verifier protocol and verifier registry"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "80085-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boobs_verification"]
