name: CI

# The swarm opens many PRs in parallel. Without a required check they land on
# main unverified, and the sandbox-escape suite -- the one that decides whether
# this project is safe to operate at all -- never runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let CI silently pass on the non-semantic stand-in: a recall-quality
  # test that "passes" on hash vectors is proving nothing. `fastembed` makes
  # the fallback in embedding.py raise instead of degrade.
  BOOBS_EMBEDDER: fastembed

jobs:
  static:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages apps

  web:
    name: site build + web tests
    runs-on: ubuntu-latest
    # apps/web has had tests since before the Python suite did and CI has never
    # run one of them. `node build.mjs` renders every public surface -- the
    # page, /llms.txt, agents.md, the MCP descriptor -- so a change that breaks
    # the build was only ever caught at deploy, and a change that made two
    # surfaces disagree was not caught at all.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the site
        working-directory: apps/web
        run: node build.mjs
      - name: Web tests
        working-directory: apps/web
        run: node --test
      - name: CLI tests
        working-directory: apps/cli
        run: node --test

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5
      - run: uv sync --all-extras --dev
      - run: uv run pytest tests/unit -q

      # Pure stdlib, no containers -- it runs the capability sources directly
      # over their own fixtures. It exits non-zero if a case stops diverging,
      # which means either a capability regressed to the naive answer or the
      # baseline went soft. Both are findings; neither should pass silently.
      - name: Correctness benchmark
        run: uv run python benchmarks/correctness.py

  integration:
    name: integration + sandbox + e2e
    runs-on: ubuntu-latest
    # The sandbox suite starts real containers and the e2e test drives a real
    # worker; both are slower than unit tests and both are the point.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5

      # docker-compose.yml is the same file used for local development, so CI
      # and a laptop agree on what "the services are up" means. Postgres must
      # be the pgvector image; a plain postgres answers SELECT 1 while every
      # recall 500s (DECISIONS.md 18).
      - name: Start services
        run: docker compose up -d postgres minio registry

      - run: uv sync --all-extras --dev

      - name: Wait for postgres
        run: |
          for _ in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U boobs; then exit 0; fi
            sleep 2
          done
          echo "postgres never became ready"; docker compose logs postgres; exit 1

      # Integration and e2e tests skip themselves without these digests, and a
      # green run made of skips is the failure mode this workflow exists to
      # prevent.
      - name: Build example capabilities
        env:
          ARTIFACT_REGISTRY: localhost:5000
        run: uv run python scripts/build_capabilities.py

      - name: Integration tests
        run: uv run pytest tests/integration -q

      # Bridged traffic does not reach iptables without this, so the egress
      # DROP rules would only ever see routed packets -- which is exactly the
      # gap that let a sandbox reach a listener on its own bridge in
      # production. The runner needs it for the same reason a worker host does.
      - name: Let bridged traffic reach iptables
        run: |
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1

      - name: Sandbox isolation tests
        # If one of these fails, fix the sandbox. Never relax the test.
        #
        # Privileged, and that is the point. Installing an iptables rule needs
        # CAP_NET_ADMIN, and without it the egress tests cannot prove anything:
        # for weeks they passed here by catching the runtime's fail-closed
        # refusal and calling that a drop. An unprivileged run of this suite is
        # not a weaker check, it is a check that cannot fail.
        run: sudo -E env "PATH=$PATH" uv run pytest tests/security -v

      - name: Cross-agent reuse (the acceptance criterion)
        run: uv run pytest tests/e2e -v

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Test process logs on failure
        if: failure()
        run: |
          for f in .test-api.log .test-worker.log; do
            [ -f "$f" ] && { echo "===== $f ====="; tail -200 "$f"; }
          done
          exit 0
